<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Balloon Master – a hot-air balloon game for the Sega Master System</title>
<style>
  :root { --bg: #0b0b24; --fg: #e8e8f0; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
               font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #game { flex: 1; min-height: 0; }
  footer { flex: none; padding: 6px 12px; text-align: center; background: #05050f; }
  kbd { background: #2a2a55; border-radius: 3px; padding: 0 5px; }
  a { color: #7fb8ff; }
</style>
</head>
<body>
<div id="game"></div>
<footer>
  Balloon Master &ndash; D-pad / Steuerkreuz: <kbd>Arrow keys</kbd> &nbsp;
  Button 1 (burner, start): <kbd>X</kbd> or <kbd>&uarr;</kbd> &nbsp; Button 2 (hook): <kbd>C</kbd> &nbsp;
  &middot; <a href="https://github.com/joergsf4/balloon-master">Source / ROM on GitHub</a>
</footer>

<script>
  EJS_player = "#game";
  EJS_core = "segaMS";                     // SMS Plus
  EJS_gameUrl = "balloon-master.sms";
  EJS_gameName = "Balloon Master";
  EJS_pathtodata = "data/";
  EJS_color = "#e74e52";
  EJS_backgroundColor = "#0b0b24";
  EJS_language = "en-US";                  // no translation files are shipped
  EJS_disableAutoLang = false;
  // Keyboard: Button 1 = X (or Up arrow = burner), Button 2 = C. X and C sit next to each other on QWERTZ and QWERTY layouts.
  EJS_defaultControls = {0:{0:{value:"x",value2:"BUTTON_2"},1:{value:"s",value2:"BUTTON_4"},2:{value:"v",value2:"SELECT"},3:{value:"enter",value2:"START"},4:{value:"up arrow",value2:"DPAD_UP"},5:{value:"down arrow",value2:"DPAD_DOWN"},6:{value:"left arrow",value2:"DPAD_LEFT"},7:{value:"right arrow",value2:"DPAD_RIGHT"},8:{value:"c",value2:"BUTTON_1"},9:{value:"a",value2:"BUTTON_3"},10:{value:"q",value2:"LEFT_TOP_SHOULDER"},11:{value:"e",value2:"RIGHT_TOP_SHOULDER"},12:{value:"tab",value2:"LEFT_BOTTOM_SHOULDER"},13:{value:"r",value2:"RIGHT_BOTTOM_SHOULDER"},14:{value:"",value2:"LEFT_STICK"},15:{value:"",value2:"RIGHT_STICK"},16:{value:"h",value2:"LEFT_STICK_X:+1"},17:{value:"f",value2:"LEFT_STICK_X:-1"},18:{value:"g",value2:"LEFT_STICK_Y:+1"},19:{value:"t",value2:"LEFT_STICK_Y:-1"},20:{value:"l",value2:"RIGHT_STICK_X:+1"},21:{value:"j",value2:"RIGHT_STICK_X:-1"},22:{value:"k",value2:"RIGHT_STICK_Y:+1"},23:{value:"i",value2:"RIGHT_STICK_Y:-1"},24:{value:"1"},25:{value:"2"},26:{value:"3"},27:{},28:{},29:{}},1:{},2:{},3:{}};
  EJS_startOnLoaded = false;               // the Play button gives the browser the click it needs for sound
  EJS_disableDatabases = true;
  if (location.search.indexOf("autostart") >= 0) EJS_startOnLoaded = true;     // for local tests
</script>
<script src="data/loader.js"></script>
</body>
</html>
